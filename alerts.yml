name: early-warning
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: early-warning
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CONTACT: ${{ secrets.CONTACT }}
        run: python3 alert_pipeline.py
      - name: Save state
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
